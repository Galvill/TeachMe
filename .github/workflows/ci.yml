name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Title and body edits are handled by pr-title.yml, not here. A skipped job
# still posts a check run that counts as passing, and it would replace this
# workflow's real result for that commit in the required checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The verification suite from .claude/agents/coder.md, on the engines floor
  # and on the current LTS.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "lts/*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # teachme validate and status resolve syncedCommit against history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node bin/teachme.js validate .teachme
      - run: node bin/teachme.js validate skill/teachme-authoring/examples/.teachme

  # The packaged-product gate, only where /process-issues' Phase 7 needs it:
  # PRs into master. Unit PRs into integration/* get the suite above only.
  gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: .claude/scripts/integration-gate.sh
