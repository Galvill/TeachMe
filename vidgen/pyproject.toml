[project]
name = "vidgen"
version = "0.0.0"
description = "Narrated technical explainer videos from a YAML script"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer",
    "ruamel.yaml",
    "httpx>=0.28.1",
    "boto3>=1.44.5",
]

[project.scripts]
vidgen = "vidgen.cli:app"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "endpoint: needs a real configured TTS or alignment endpoint (skipped in CI)",
]
